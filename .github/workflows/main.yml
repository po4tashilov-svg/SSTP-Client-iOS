name: Build IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Xcode Project
        run: |
          xcodebuild -project SSTP-Client.xcodeproj \
                     -scheme "SSTP-Client" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/SSTP-Client.app Payload/
          zip -r SSTP-Client.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sstp-client-ipa
          path: SSTP-Client.ipa
